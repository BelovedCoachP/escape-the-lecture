<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Labeled cross section of a chloroplast.">
  <!-- PUZZLE-CRITICAL ASSET. Hand-authored, never AI-generated.
       Level 1 turns on AURA claiming the outer membrane is "bright blue".
       This diagram is rendered strictly in greens and yellows so that claim
       is provably false. Do not introduce blue anywhere in this file. -->
  <title>Labeled cross section of a chloroplast.</title>
  <rect width="800" height="500" fill="#FDFCF0"/>

  <!-- Outer membrane (green, deliberately not blue) -->
  <ellipse cx="400" cy="250" rx="330" ry="180" fill="#8FBF6B" stroke="#3F6B2B" stroke-width="6"/>
  <!-- Inner membrane -->
  <ellipse cx="400" cy="250" rx="312" ry="163" fill="#B8D98F" stroke="#4E7F35" stroke-width="4"/>
  <!-- Stroma -->
  <ellipse cx="400" cy="250" rx="298" ry="150" fill="#D9E9B8"/>

  <!-- Grana: stacked thylakoid discs -->
  <g stroke="#2F5A20" stroke-width="2">
    <g fill="#5E9440">
      <ellipse cx="250" cy="205" rx="52" ry="11"/>
      <ellipse cx="250" cy="222" rx="52" ry="11"/>
      <ellipse cx="250" cy="239" rx="52" ry="11"/>
      <ellipse cx="250" cy="256" rx="52" ry="11"/>
    </g>
    <g fill="#6BA349">
      <ellipse cx="415" cy="300" rx="48" ry="10"/>
      <ellipse cx="415" cy="316" rx="48" ry="10"/>
      <ellipse cx="415" cy="332" rx="48" ry="10"/>
    </g>
    <g fill="#5E9440">
      <ellipse cx="545" cy="200" rx="46" ry="10"/>
      <ellipse cx="545" cy="216" rx="46" ry="10"/>
      <ellipse cx="545" cy="232" rx="46" ry="10"/>
    </g>
  </g>
  <!-- Lamellae connecting grana stacks -->
  <path d="M300 230 Q355 265 370 315" fill="none" stroke="#7DB356" stroke-width="7"/>
  <path d="M460 310 Q510 265 505 218" fill="none" stroke="#7DB356" stroke-width="7"/>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#24401A">
    <!-- Label: outer membrane -->
    <line x1="400" y1="70" x2="400" y2="104" stroke="#24401A" stroke-width="2"/>
    <text x="400" y="60" text-anchor="middle">Outer membrane</text>
    <!-- Label: inner membrane -->
    <line x1="620" y1="392" x2="565" y2="352" stroke="#24401A" stroke-width="2"/>
    <text x="626" y="406">Inner membrane</text>
    <!-- Label: stroma -->
    <line x1="185" y1="392" x2="250" y2="345" stroke="#24401A" stroke-width="2"/>
    <text x="178" y="406" text-anchor="end">Stroma</text>
    <!-- Label: grana -->
    <line x1="250" y1="180" x2="250" y2="195" stroke="#24401A" stroke-width="2"/>
    <text x="250" y="172" text-anchor="middle">Grana (thylakoid stacks)</text>
  </g>

  <!-- Arrow: light entering the thylakoid membrane -->
  <defs>
    <marker id="arrowGold" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#C79A16"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3F6B2B"/>
    </marker>
  </defs>
  <line x1="95" y1="120" x2="215" y2="200" stroke="#C79A16" stroke-width="5" marker-end="url(#arrowGold)"/>
  <text x="88" y="112" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#8A6A0A">Light</text>

  <!-- Arrow: glucose exiting into the stroma -->
  <line x1="470" y1="345" x2="600" y2="300" stroke="#3F6B2B" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="608" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#24401A">Glucose</text>
</svg>
