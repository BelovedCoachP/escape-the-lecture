<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1080" width="820" height="1080" role="img" aria-label="Lab 6 handout as students see it: a tidy one-page lab sheet with bold section headings, a safety box, and blue links.">
  <!-- PUZZLE-CRITICAL ASSET. Hand-authored, never AI-generated.
       This page IS the Document Labyrinth's artifact. Its whole job is to look
       perfectly fine: the four 16pt section headings must render identically
       even though (per the hunt challenge) only Procedure and Results are
       tagged as headings in the "document" the player audits. The safety box
       floats top right (reading-order puzzle), the "click here" / raw URL /
       triple "More" links are the link-text puzzle, and the visible text
       matches the sequence items' quoted lines. Do not regenerate, restyle,
       or fix the links: the flaws are the content. -->
  <title>Lab 6 handout as students see it: a tidy one-page lab sheet with bold section headings, a safety box, and blue links.</title>
  <rect width="820" height="1080" fill="#0F172A"/>
  <rect x="20" y="20" width="780" height="1040" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#1F2937">
    <!-- Title (Heading 1 in the tag tree) -->
    <text x="60" y="95" font-size="27" font-weight="bold">Lab 6: Osmosis and Diffusion</text>
    <line x1="60" y1="112" x2="760" y2="112" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Introduction -->
    <g font-size="14">
      <text x="60" y="146">In this lab you will watch osmosis happen across a membrane and measure how</text>
      <text x="60" y="168">quickly dye diffuses at three temperatures. You will work in pairs and hand in</text>
      <text x="60" y="190">one results sheet. Gather the materials listed below before you begin.</text>
    </g>

    <!-- Materials (looks like a heading; tagged Paragraph in the tag tree) -->
    <text x="60" y="248" font-size="16" font-weight="bold">Materials</text>
    <g font-size="14">
      <text x="72" y="278">&#8226; Dialysis tubing, two lengths</text>
      <text x="72" y="302">&#8226; Iodine solution</text>
      <text x="72" y="326">&#8226; Two 250 mL beakers</text>
      <text x="72" y="350">&#8226; Nitrile gloves</text>
      <text x="72" y="374">&#8226; Stopwatch</text>
    </g>

    <!-- Safety box, floating top right: the reading-order trap -->
    <rect x="450" y="222" width="310" height="112" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
    <text x="470" y="258" font-size="14" font-weight="bold">Gloves on before the first step.</text>
    <g font-size="13">
      <text x="470" y="285">You will handle iodine at step 2.</text>
      <text x="470" y="307">Iodine stains skin and clothing.</text>
    </g>

    <!-- Procedure (Heading 2 in the tag tree) -->
    <text x="60" y="432" font-size="16" font-weight="bold">Procedure</text>
    <g font-size="14">
      <text x="72" y="462">1. Fill both beakers with 150 mL of water.</text>
      <text x="72" y="486">2. Add ten drops of iodine solution to the first beaker.</text>
      <text x="72" y="510">3. Tie off one end of each length of dialysis tubing.</text>
      <text x="72" y="534">4. Fill the tubing with starch solution and seal it.</text>
      <text x="72" y="558">5. Submerge one tube in each beaker and start the stopwatch.</text>
      <text x="72" y="582">6. Observe both tubes at two-minute intervals.</text>
      <text x="72" y="606">7. Note any color change in the tubing or the water.</text>
      <text x="72" y="630">8. Record each change in the results table below.</text>
    </g>
    <g font-size="14">
      <text x="60" y="668">For the grading rubric, <tspan fill="#2563EB" text-decoration="underline">click here</tspan>. A virtual version of this lab is available at</text>
      <text x="60" y="690"><tspan fill="#2563EB" text-decoration="underline">https://sim.example.edu/labs/osmo-4127/run</tspan>.</text>
    </g>

    <!-- Results (Heading 2 in the tag tree) -->
    <text x="60" y="746" font-size="16" font-weight="bold">Results</text>
    <g stroke="#94A3B8" stroke-width="1">
      <rect x="60" y="764" width="700" height="132" fill="none"/>
      <line x1="60" y1="797" x2="760" y2="797"/>
      <line x1="60" y1="830" x2="760" y2="830"/>
      <line x1="60" y1="863" x2="760" y2="863"/>
      <line x1="180" y1="764" x2="180" y2="896"/>
      <line x1="560" y1="764" x2="560" y2="896"/>
    </g>
    <g font-size="13" font-weight="bold">
      <text x="72" y="786">Interval</text>
      <text x="192" y="786">Observation</text>
      <text x="572" y="786">Time</text>
    </g>

    <!-- Clean-up (looks like a heading; tagged Paragraph in the tag tree) -->
    <text x="60" y="946" font-size="16" font-weight="bold">Clean-up</text>
    <g font-size="14">
      <text x="60" y="976">Once your results table is complete, rinse the beakers and return everything</text>
      <text x="60" y="998">to the cart. Wash your hands before leaving the lab.</text>
    </g>

    <!-- Footer: credit line + the three identical links -->
    <text x="60" y="1040" font-size="11" font-style="italic" fill="#475569">Adapted from Dr. Okafor's lab manual.</text>
    <g font-size="12" fill="#2563EB" text-decoration="underline">
      <text x="560" y="1040">More</text>
      <text x="630" y="1040">More</text>
      <text x="700" y="1040">More</text>
    </g>
  </g>
</svg>
